<?xml version="1.0"?>
<svg width="750" height="650" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <!-- Title -->
 <!-- TARTARUS' GATE COLUMN -->
 <!-- Key Differences Box (small, compact) -->
 <g class="layer" display="inline">
  <title>Layer 1</title>
  <text x="300" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#000" id="svg_1">
    Tartarus&#x27; Gate: Search Algorithm Flowchart
  </text>
  <g id="tartarus-column" transform="matrix(1 0 0 1 -5 0)">
   <text x="280" y="80" font-size="18" font-weight="bold" text-anchor="middle" fill="#D32F2F" id="svg_2">
      Tartarus&#x27; Gate (Block Search)
    </text>
   <!-- Start -->
   <ellipse cx="280" cy="125" rx="45" ry="22" fill="#4CAF50" stroke="#333" stroke-width="2" id="svg_3"/>
   <text x="280" y="132" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" id="svg_4">START</text>
   <!-- Arrow from START -->
   <line x1="280" y1="147" x2="280" y2="170" stroke="#333" stroke-width="2" id="svg_5"/>
   <polygon points="280,170 275,160 285,160" fill="#333" id="svg_6"/>
   <!-- Find target function -->
   <rect x="190" y="170" width="180" height="50" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2" rx="5" id="svg_7"/>
   <text x="280" y="193" font-size="10" text-anchor="middle" fill="#000" id="svg_8">Find target function</text>
   <text x="280" y="208" font-size="10" text-anchor="middle" fill="#000" id="svg_9">by hash (EAT)</text>
   <!-- Arrow -->
   <line x1="280" y1="220" x2="280" y2="245" stroke="#333" stroke-width="2" id="svg_10"/>
   <polygon points="280,245 275,235 285,235" fill="#333" id="svg_11"/>
   <!-- Initialize idx=1 -->
   <rect x="190" y="245" width="180" height="50" fill="#FFF9C4" stroke="#F57F17" stroke-width="2" rx="5" id="svg_12"/>
   <text x="280" y="267" font-size="10" text-anchor="middle" fill="#000" font-weight="bold" id="svg_13">Initialize idx = 1</text>
   <text x="280" y="282" font-size="9" text-anchor="middle" fill="#666" id="svg_14">(block counter)</text>
   <!-- Arrow -->
   <line x1="280" y1="295" x2="280" y2="320" stroke="#333" stroke-width="2" id="svg_15"/>
   <polygon points="280,320 275,310 285,310" fill="#333" id="svg_16"/>
   <!-- Check DOWN -->
   <polygon points="280,320 340,360 280,400 220,360" fill="#FFE0B2" stroke="#F57F17" stroke-width="2" id="svg_17"/>
   <text x="280" y="360" font-size="9" text-anchor="middle" fill="#000" font-weight="bold" id="svg_18">Pattern</text>
   <text x="280" y="373" font-size="9" text-anchor="middle" fill="#000" font-weight="bold" id="svg_19">DOWN?</text>
   <!-- YES DOWN path -->
   <line x1="340" y1="360" x2="380" y2="360" stroke="#4CAF50" stroke-width="2" id="svg_20"/>
   <polygon points="380,360 370,355 370,365" fill="#4CAF50" id="svg_21"/>
   <text x="355" y="352" font-size="9" fill="#4CAF50" font-weight="bold" id="svg_22">YES</text>
   <!-- Extract SSN (right) -->
   <rect x="382" y="340" width="100" height="40" fill="#4CAF50" stroke="#333" stroke-width="2" rx="5" id="svg_23"/>
   <text x="430" y="365" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold" id="svg_24" transform="matrix(1 0 0 1 3 0)">Extract SSN</text>
   <!-- Arrow down to next check -->
   <line x1="280" y1="400" x2="280" y2="430" stroke="#333" stroke-width="2" id="svg_25"/>
   <polygon points="280,430 275,420 285,420" fill="#333" id="svg_26"/>
   <text x="260" y="420" font-size="9" fill="#7B1FA2" font-weight="bold" id="svg_27">NO</text>
   <!-- Check UP -->
   <polygon points="280,430 340,470 280,510 220,470" fill="#FFE0B2" stroke="#F57F17" stroke-width="2" id="svg_28"/>
   <text x="280" y="470" font-size="9" text-anchor="middle" fill="#000" font-weight="bold" id="svg_29">Pattern</text>
   <text x="280" y="483" font-size="9" text-anchor="middle" fill="#000" font-weight="bold" id="svg_30">UP?</text>
   <!-- YES UP path -->
   <line x1="340" y1="470" x2="380" y2="470" stroke="#4CAF50" stroke-width="2" id="svg_31"/>
   <polygon points="380,470 370,465 370,475" fill="#4CAF50" id="svg_32"/>
   <text x="355" y="462" font-size="9" fill="#4CAF50" font-weight="bold" id="svg_33">YES</text>
   <!-- Extract SSN (right, UP) -->
   <rect x="380" y="450" width="100" height="40" fill="#4CAF50" stroke="#333" stroke-width="2" rx="5" id="svg_34"/>
   <text x="430" y="475" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold" id="svg_35" transform="matrix(1 0 0 1 0 0) matrix(1 0 0 1 0 0) matrix(1 0 0 1 0 0)">Extract SSN</text>
   <!-- NO path (increment idx) -->
   <line x1="220" y1="470" x2="140" y2="470" stroke="#7B1FA2" stroke-width="2" id="svg_36"/>
   <polygon points="140,470 150,465 150,475" fill="#7B1FA2" id="svg_37"/>
   <text x="175" y="462" font-size="9" fill="#7B1FA2" font-weight="bold" id="svg_38">NO</text>
   <!-- idx++ box -->
   <rect x="50" y="445" width="110" height="50" fill="#E1BEE7" stroke="#7B1FA2" stroke-width="2" rx="5" id="svg_39"/>
   <text x="105" y="467" font-size="10" text-anchor="middle" fill="#000" font-weight="bold" id="svg_40">idx++</text>
   <text x="105" y="483" font-size="9" text-anchor="middle" fill="#666" id="svg_41">(next block)</text>
   <!-- Loop back -->
   <line x1="105" y1="445" x2="105" y2="360" stroke="#7B1FA2" stroke-width="2" id="svg_42"/>
   <line x1="105" y1="360" x2="220" y2="360" stroke="#7B1FA2" stroke-width="2" id="svg_43"/>
   <polygon points="220,360 210,355 210,365" fill="#7B1FA2" id="svg_44"/>
   <!-- End (right side) -->
   <ellipse cx="532" cy="416" rx="45" ry="22" fill="#FF6B6B" stroke="#333" stroke-width="2" id="svg_45"/>
   <text x="480" y="422" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold" id="svg_46" transform="matrix(1 0 0 1 50 -3)">END</text>
   <!-- Arrows to END -->
   <line x1="482" y1="361" x2="502" y2="401" stroke="#333" stroke-width="2" id="svg_47"/>
   <line x1="481" y1="472" x2="501" y2="432" stroke="#333" stroke-width="2" id="svg_48"/>
  </g>
  <g id="key-diff">
   <rect x="550" y="170" width="174" height="184" fill="#F5F5F5" stroke="#D32F2F" stroke-width="2" rx="5" id="svg_49"/>
   <text x="640" y="190" font-size="11" font-weight="bold" text-anchor="middle" fill="#D32F2F" id="svg_50">
      Key Differences
    </text>
   <text x="560" y="215" font-size="9" font-weight="bold" fill="#333" id="svg_51">
      Strategy:
    </text>
   <text x="560" y="230" font-size="8" fill="#666" id="svg_52">
      Search neighbor functions
    </text>
   <text x="560" y="250" font-size="9" font-weight="bold" fill="#333" id="svg_53">
      Search Method:
    </text>
   <text x="560" y="265" font-size="8" fill="#666" id="svg_54">
      Block search (idx × ±32)
    </text>
   <text x="560" y="285" font-size="9" font-weight="bold" fill="#333" id="svg_55">
      Increment:
    </text>
   <text x="560" y="300" font-size="8" fill="#666" id="svg_56">
      32-byte steps
    </text>
   <text x="560" y="320" font-size="9" font-weight="bold" fill="#333" id="svg_57">
      Advantage:
    </text>
   <text x="560" y="335" font-size="8" fill="#666" id="svg_58">
      Works if entire function
    </text>
   <text x="560" y="348" font-size="8" fill="#666" id="svg_59">
      is hooked
    </text>
  </g>
 </g>
</svg>